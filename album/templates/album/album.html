{% extends "album/base.html" %}
{% block header %}
    <nav>
        <a href="{% url 'album-home' %}">Home</a>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </nav>
{% endblock header %}

{% block content %}
    {% for invertebrate in invertebrates %}
        {{ invertebrate.name }}
    {% endfor %}
{% endblock content %}
