{% extends "album/base.html" %}
{% block header %}
    <div class="nav-content">
        <a href="{% url 'album' %}">Back</a>
        <a href="{% url 'album-home' %}">Home</a>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="logout-button" type="submit">Logout</button>
        </form>
    </div>
{% endblock header %}
{% block content %}
<form class="invertebrate-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Nombre común:</label>
        {{ form.name }}
        <label>Nombre científico:</label>
        {{ form.scientific_name }}
        <label>Clase:</label>
        {{ form.taxon_class }}
        <label>Orden:</label>
        {{ form.taxon_order }}
        <label>Datos:</label>
        {{ form.facts }}
        <label>Imagen:</label>
        {{ form.image }}
        <br>
        <button type="delete">Crear</button>
    </form>
{% endblock content %}
